<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Interativo – Malai Manso Resort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
<style>
:root{--or:#F7941D;--navy:#0B2A5B;--ye:#F2D544;--bg:#fff;--mut:#5b6678;--line:#e5e9f0;--ok:#1f9d55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Montserrat,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
h1{margin:6px 0 12px;text-align:center;font-size:26px;font-weight:800;line-height:1.1}
h1 span{color:var(--or)}
.eyebrow{display:block;text-align:center;color:var(--or);font-weight:700;letter-spacing:.12em;font-size:13px}
#box{position:relative;width:100%;aspect-ratio:954/639;overflow:hidden;border-radius:12px;background:#9bb36a;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;will-change:transform}
#stage img{display:block;width:100%;height:auto;pointer-events:none}
.pin{position:absolute;width:calc(44px / var(--s,1));height:calc(44px / var(--s,1));margin:calc(-22px / var(--s,1)) 0 0 calc(-22px / var(--s,1));border-radius:50%;cursor:pointer}
.pin.sel::after{content:"";position:absolute;inset:calc(6px / var(--s,1));border-radius:50%;border:calc(3px / var(--s,1)) solid var(--or);background:rgba(247,148,29,.25);animation:p 1.4s ease-out infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(247,148,29,.7)}100%{box-shadow:0 0 0 calc(16px / var(--s,1)) rgba(247,148,29,0)}}
#me{position:absolute;display:none;width:calc(22px / var(--s,1));height:calc(22px / var(--s,1));margin:calc(-11px / var(--s,1)) 0 0 calc(-11px / var(--s,1));border-radius:50%;background:#2b7fff;border:calc(3px / var(--s,1)) solid #fff;box-shadow:0 0 0 calc(2px / var(--s,1)) rgba(43,127,255,.45),0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button,.fab{width:40px;height:40px;border:0;border-radius:10px;background:#fff;color:var(--navy);font:800 22px/1 Montserrat;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.fab{position:absolute;left:8px;top:8px;font-size:18px}
.card{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#f7f9fc}
.card h2{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.num{display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:15px}
.dist{margin:8px 0 0;font-size:15px;font-weight:700;color:var(--ok)}
.hint{margin:6px 0 0;font-size:13px;color:var(--mut);line-height:1.4}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:700 14px Montserrat;background:var(--navy);color:#fff;text-decoration:none;display:inline-block}
.btn.or{background:var(--or)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.gps{margin-top:12px}
.stat{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.4}
.arrow{display:inline-block;transition:transform .2s}
ul{list-style:none;margin:14px 0 0;padding:0}
li button{width:100%;display:flex;align-items:center;gap:14px;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;font:500 18px Montserrat;color:#333;text-align:left}
li button.on{background:#fff4e3}
li .d{margin-left:auto;font-size:13px;font-weight:700;color:var(--ok)}
</style>
</head>

].map(p=>({n:p[0],name:p[1],x:p[2],y:p[3]}));

const box=document.getElementById('box'),stage=document.getElementById('stage'),me=document.getElementById('me');
let s=1,tx=0,ty=0,sel=null,fix=null,cal=[],watch=null;
try{cal=JSON.parse(localStorage.getItem('malai_cal')||'[]')}catch(e){}

// pins
PINS.forEach(p=>{
  const b=document.createElement('div');b.className='pin';b.dataset.n=p.n;
  b.style.left=(p.x/W*100)+'%';b.style.top=(p.y/H*100)+'%';stage.appendChild(b);p.el=b;
});
// list
const ul=document.getElementById('list');
PINS.forEach(p=>{
  const li=document.createElement('li');
  li.innerHTML=`<button data-n="${p.n}"><span class="num">${p.n}</span><span>${p.name}</span><span class="d" id="d${p.n}"></span></button>`;
  li.firstChild.onclick=()=>select(p.n,true);ul.appendChild(li);
});

// view
function bw(){return box.clientWidth}
function clamp(){const w=bw(),h=w*H/W;
  tx=Math.min(0,Math.max(w-w*s,tx));ty=Math.min(0,Math.max(h-h*s,ty));}
function apply(){clamp();stage.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;stage.style.setProperty('--s',s);}
function zoomAt(f,cx,cy){const ns=Math.min(5,Math.max(1,s*f));const k=ns/s;
  tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;s=ns;apply();}
function centerOn(p,ns){const w=bw(),h=w*H/W;s=ns;tx=w/2-(p.x/W*w)*s;ty=h/2-(p.y/H*h)*s;apply();}
document.getElementById('zi').onclick=()=>zoomAt(1.6,bw()/2,bw()*H/W/2);
document.getElementById('zo').onclick=()=>zoomAt(1/1.6,bw()/2,bw()*H/W/2);
document.getElementById('fit').onclick=()=>{s=1;tx=ty=0;apply();};
window.addEventListener('resize',apply);

// gestures
const ptrs=new Map();let moved=0,startPin=null,pinch=null;
box.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=0;startPin=e.target.closest('.pin');}
  if(ptrs.size===2){pinch=dist2();moved=99;}
});
box.addEventListener('pointermove',e=>{
  const o=ptrs.get(e.pointerId);if(!o)return;
  const r=box.getBoundingClientRect();
  if(ptrs.size===1){
    const dx=e.clientX-o.x,dy=e.clientY-o.y;moved+=Math.abs(dx)+Math.abs(dy);
    tx+=dx;ty+=dy;apply();
  }else if(ptrs.size===2){
    const prev=dist2();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const now=dist2();const m=mid();
    if(prev>0)zoomAt(now/prev,m.x-r.left,m.y-r.top);return;
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
function up(e){
  if(ptrs.size===1&&moved<8&&startPin&&e.type==='pointerup')select(+startPin.dataset.n,false);
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
}
box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
box.addEventListener('wheel',e=>{e.preventDefault();const r=box.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top);},{passive:false});
function dist2(){const a=[...ptrs.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function mid(){const a=[...ptrs.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}

// selection
function select(n,zoom){
  sel=PINS.find(p=>p.n===n);
  PINS.forEach(p=>p.el.classList.toggle('sel',p===sel));
  document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  if(zoom)centerOn(sel,Math.max(s,2.2));
  renderCard();
}
function renderCard(){
  const h=document.getElementById('cname'),i=document.getElementById('cinfo');
  if(!sel){h.textContent='Toque num ponto do mapa';i.innerHTML='';return;}
  h.innerHTML=`<span class="num">${sel.n}</span>${sel.name}`;
  let html='';const T=transform();
  if(T&&fix){
    const d=distTo(sel,T);const dir=bearing(sel,T);
    html+=`<p class="dist"><span class="arrow" style="transform:rotate(${dir}deg)">⬆</span> ${fmt(d)} de você</p>`;
    html+=`<p class="hint">A seta aponta para o ponto, com o norte do mapa para cima na imagem. Distância em linha reta.</p>`;
  }else if(fix){
    html+=`<p class="hint">Para ver a distância, calibre o GPS: vá até 2 pontos diferentes do resort e toque em “Estou aqui” em cada um.</p>`;
  }
  if(fix)html+=`<div class="row"><button class="btn" id="calbtn">📌 Estou aqui (calibrar este ponto)</button></div>`;
  i.innerHTML=html;
  const cb=document.getElementById('calbtn');if(cb)cb.onclick=()=>calibrate(sel);
}

// geo math: image px = a * w + b (complex), w = local meters (east, -north)
function toM(lat,lng,lat0){return{x:(lng)*Math.cos(lat0*Math.PI/180)*111320,y:-(lat)*110540}}
function transform(){
  if(cal.length<2)return null;
  const lat0=cal[0].lat;
  const w=cal.map(c=>toM(c.lat,c.lng,lat0));
  const z=cal.map(c=>{const p=PINS.find(q=>q.n===c.n);return{x:p.x,y:p.y}});
  const n=cal.length;
  const wc={x:w.reduce((a,b)=>a+b.x,0)/n,y:w.reduce((a,b)=>a+b.y,0)/n};
  const zc={x:z.reduce((a,b)=>a+b.x,0)/n,y:z.reduce((a,b)=>a+b.y,0)/n};
  let nr=0,ni=0,dn=0;
  for(let i=0;i<n;i++){
    const a={x:w[i].x-wc.x,y:w[i].y-wc.y},b={x:z[i].x-zc.x,y:z[i].y-zc.y};
    nr+=a.x*b.x+a.y*b.y;ni+=a.x*b.y-a.y*b.x;dn+=a.x*a.x+a.y*a.y;
  }
  if(dn<1)return null; // pontos calibrados muito próximos
  const a={x:nr/dn,y:ni/dn};
  const b={x:zc.x-(a.x*wc.x-a.y*wc.y),y:zc.y-(a.x*wc.y+a.y*wc.x)};
  return{a,b,lat0};
}
function project(T,lat,lng){const m=toM(lat,lng,T.lat0);
  return{x:T.a.x*m.x-T.a.y*m.y+T.b.x,y:T.a.x*m.y+T.a.y*m.x+T.b.y};}
function mpp(T){return 1/Math.hypot(T.a.x,T.a.y)}
function distTo(p,T){const u=project(T,fix.lat,fix.lng);return Math.hypot(p.x-u.x,p.y-u.y)*mpp(T)}
function bearing(p,T){const u=project(T,fix.lat,fix.lng);return Math.atan2(p.x-u.x,-(p.y-u.y))*180/Math.PI}
function fmt(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km'}

function calibrate(p){
  if(!fix)return;
  cal=cal.filter(c=>c.n!==p.n);cal.push({n:p.n,lat:fix.lat,lng:fix.lng});
  if(cal.length>4)cal.shift();
  try{localStorage.setItem('malai_cal',JSON.stringify(cal))}catch(e){}
  refresh();
}
function clearCal(){cal=[];try{localStorage.removeItem('malai_cal')}catch(e){}refresh();}

function refresh(){
  const T=transform();
  const c=document.getElementById('cal');
  if(!cal.length)c.innerHTML='Calibração: nenhum ponto ainda.';
  else c.innerHTML=`Calibração: ${cal.length} ponto(s) (${cal.map(x=>x.n).join(', ')}) ${T?'✔ pronta':'– falta mais um ponto, afastado do primeiro'} · <a href="#" id="clr">limpar</a>`;
  const clr=document.getElementById('clr');if(clr)clr.onclick=e=>{e.preventDefault();clearCal();};
  PINS.forEach(p=>{const d=document.getElementById('d'+p.n);d.textContent=(T&&fix)?fmt(distTo(p,T)):'';});
  if(T&&fix){const u=project(T,fix.lat,fix.lng);
    me.style.display='block';me.style.left=(u.x/W*100)+'%';me.style.top=(u.y/H*100)+'%';
    const out=u.x<-40||u.y<-40||u.x>W+40||u.y>H+40;
    document.getElementById('gstat').innerHTML=`GPS ativo · precisão ~${Math.round(fix.acc)} m`+(out?' · <b>você está fora da área do mapa</b>':'');
  }else me.style.display='none';
  renderCard();
}

// GPS
const gb=document.getElementById('gpsbtn'),gs=document.getElementById('gstat');
gb.onclick=()=>{
  if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;fix=null;gb.textContent='📍 Ativar GPS';
    gs.textContent='GPS desligado.';refresh();return;}
  if(!('geolocation' in navigator)){gs.textContent='Este navegador não oferece GPS.';return;}
  gs.textContent='Buscando sinal de GPS…';
  try{
    watch=navigator.geolocation.watchPosition(pos=>{
      fix={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
      gb.textContent='⏹ Desligar GPS';
      if(!transform())gs.textContent=`GPS ativo · precisão ~${Math.round(fix.acc)} m · calibre 2 pontos para ver sua posição no mapa.`;
      refresh();
    },err=>{
      watch=null;
      gs.innerHTML=err.code===1
        ?'Permissão de localização negada ou bloqueada. Se esta página abriu dentro de outro app, o GPS pode estar bloqueado ali; libere a localização para o navegador ou abra o link direto no navegador.'
        :'Não foi possível obter o GPS agora. Tente ao ar livre.';
    },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }catch(e){gs.textContent='O GPS está bloqueado neste ambiente.';}
};

apply();refresh();
</script>
</body>
</html>
